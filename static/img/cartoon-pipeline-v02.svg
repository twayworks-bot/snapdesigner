      .title { font-family: 'Pretendard Variable', sans-serif; font-weight: 800; font-size: 24px; fill: #1E1B4B; }
      .subtitle { font-family: 'Pretendard Variable', sans-serif; font-weight: 600; font-size: 14px; fill: #4F46E5; }
