      .caption-desc { font-family: 'Pretendard Variable', sans-serif; font-weight: 500; font-size: 12px; fill: #475569; }
      .badge-text { font-family: 'Pretendard Variable', sans-serif; font-weight: 800; font-size: 11px; fill: #FFFFFF; }
